services:
  db:
    image: postgres:17
    container_name: recruitment_ats_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment_ats
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - recruitment_ats_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d recruitment_ats"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recruitment_ats_data:
